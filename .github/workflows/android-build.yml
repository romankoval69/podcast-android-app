name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Verify Android Project Structure
      run: |
        echo "=== Pure Native Android Project ==="
        echo "📱 Project type: Native Android (no web components)"
        echo "🔧 Build system: Gradle with Android Gradle Plugin"
        echo "📁 Source files:"
        find android/app/src/main/java -name "*.java" | head -10
        echo ""
        echo "📋 Layout files:"
        find android/app/src/main/res/layout -name "*.xml" | head -10
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses
      
    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-35"
        sdkmanager "build-tools;35.0.0"
        sdkmanager "platform-tools"
        sdkmanager "tools"
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Debug Android structure
      run: |
        echo "=== Android Project Structure Debug ==="
        echo "📁 Gradle files:"
        find android -name "*.gradle" -type f | head -20
        echo ""
        echo "📋 Native Android configuration:"
        echo "✅ Pure native Android project (no Capacitor dependencies)"
        echo ""
        echo "🔧 Gradle wrapper:"
        ls -la android/gradlew
        echo ""
        echo "📱 App build config:"
        head -5 android/app/build.gradle
        
    - name: Make Gradle wrapper executable
      run: chmod +x android/gradlew
      
    - name: Clean Gradle cache for fresh build
      run: |
        cd android
        echo "Cleaning Gradle cache..."
        ./gradlew clean --warning-mode all
        echo "✓ Gradle clean completed"
      
    - name: Build Debug APK
      run: |
        cd android
        echo "🔨 Building Debug APK..."
        ./gradlew assembleDebug --stacktrace --warning-mode all --no-daemon --parallel
        echo "✅ Debug APK build completed"
        ls -la app/build/outputs/apk/debug/
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Build Release APK
      run: |
        cd android
        echo "🔨 Building Release APK..."
        ./gradlew assembleRelease --stacktrace --warning-mode all --no-daemon --parallel
        echo "✅ Release APK build completed"
        ls -la app/build/outputs/apk/release/
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk