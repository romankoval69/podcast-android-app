name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install npm dependencies
      run: npm ci
      
    - name: Sync Capacitor and copy web assets
      run: |
        npx cap sync android
        
    - name: Ensure cordova.variables.gradle exists
      run: |
        if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
          echo "Creating missing cordova.variables.gradle file..."
          cat > android/capacitor-cordova-android-plugins/cordova.variables.gradle << 'EOF'
        // DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
        ext {
          cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
          // Plugin gradle extensions can append to this to have code run at the end.
          cdvPluginPostBuildExtras = []
          cordovaConfig = [:]
        }
        EOF
          echo "✓ cordova.variables.gradle created successfully"
        else
          echo "✓ cordova.variables.gradle already exists"
        fi
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses
      
    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-35"
        sdkmanager "build-tools;35.0.0"
        sdkmanager "platform-tools"
        sdkmanager "tools"
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Debug Android structure
      run: |
        echo "=== Android Project Structure Debug ==="
        echo "📁 Gradle files:"
        find android -name "*.gradle" -type f | head -20
        echo ""
        echo "📋 Capacitor configuration:"
        ls -la android/capacitor-cordova-android-plugins/cordova.variables.gradle || echo "❌ cordova.variables.gradle not found"
        echo ""
        echo "🔧 Gradle wrapper:"
        ls -la android/gradlew
        echo ""
        echo "📱 App build config:"
        head -5 android/app/build.gradle
        
    - name: Make Gradle wrapper executable
      run: chmod +x android/gradlew
      
    - name: Clean Gradle cache for fresh build
      run: |
        cd android
        echo "Cleaning Gradle cache..."
        ./gradlew clean --warning-mode all
        echo "✓ Gradle clean completed"
      
    - name: Build Debug APK
      run: |
        cd android
        echo "🔨 Building Debug APK..."
        ./gradlew assembleDebug --stacktrace --warning-mode all --no-daemon --parallel
        echo "✅ Debug APK build completed"
        ls -la app/build/outputs/apk/debug/
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Build Release APK
      run: |
        cd android
        echo "🔨 Building Release APK..."
        ./gradlew assembleRelease --stacktrace --warning-mode all --no-daemon --parallel
        echo "✅ Release APK build completed"
        ls -la app/build/outputs/apk/release/
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk